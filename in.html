<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Stars!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 500px;
            background: #16213e;
            border: 4px solid #0f3460;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #basket {
            position: absolute;
            bottom: 20px;
            left: 170px;
            width: 60px;
            height: 20px;
            background-color: #e94560;
            border-radius: 10px;
            box-shadow: 0 0 10px #e94560;
        }
        .star {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #f1c40f;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            box-shadow: 0 0 10px #f1c40f;
        }
        #ui-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            display: none;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #1e8e56;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-bar">
            <span>Score: <span id="score">0</span></span>
            <span>Missed: <span id="missed">0</span>/5</span>
        </div>
        <div id="basket"></div>
        <div id="game-over">
            <h1>Game Over</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button onclick="startGame()">Play Again</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const basket = document.getElementById('basket');
        const scoreDisplay = document.getElementById('score');
        const missedDisplay = document.getElementById('missed');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');

        let basketX = 170;
        let score = 0;
        let missed = 0;
        let gameActive = true;
        let stars = [];
        let spawnInterval;
        let gameLoopId;

        // Move Basket with Keyboard
        document.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            if (e.key === 'ArrowLeft' && basketX > 0) {
                basketX -= 25;
            } else if (e.key === 'ArrowRight' && basketX < container.clientWidth - 60) {
                basketX += 25;
            }
            basket.style.left = basketX + 'px';
        });

        // Move Basket with Mouse / Touch
        container.addEventListener('mousemove', (e) => {
            if (!gameActive) return;
            const rect = container.getBoundingClientRect();
            let mouseX = e.clientX - rect.left - 30;
            if (mouseX < 0) mouseX = 0;
            if (mouseX > container.clientWidth - 60) mouseX = container.clientWidth - 60;
            basketX = mouseX;
            basket.style.left = basketX + 'px';
        });

        function spawnStar() {
            if (!gameActive) return;
            const star = document.createElement('div');
            star.classList.add('star');
            const x = Math.floor(Math.random() * (container.clientWidth - 20));
            star.style.left = x + 'px';
            star.style.top = '0px';
            container.appendChild(star);
            stars.push({ element: star, x: x, y: 0, speed: 2 + Math.random() * 3 });
        }

        function update() {
            if (!gameActive) return;

            for (let i = stars.length - 1; i >= 0; i--) {
                let star = stars[i];
                star.y += star.speed;
                star.element.style.top = star.y + 'px';

                // Catch detection
                if (star.y >= 450 && star.y <= 470 && star.x + 20 >= basketX && star.x <= basketX + 60) {
                    score += 10;
                    scoreDisplay.textContent = score;
                    star.element.remove();
                    stars.splice(i, 1);
                    continue;
                }

                // Miss detection
                if (star.y > 500) {
                    missed++;
                    missedDisplay.textContent = missed;
                    star.element.remove();
                    stars.splice(i, 1);

                    if (missed >= 5) {
                        endGame();
                    }
                }
            }

            if (gameActive) {
                gameLoopId = requestAnimationFrame(update);
            }
        }

        function startGame() {
            // Clean old stars
            stars.forEach(star => star.element.remove());
            stars = [];
            score = 0;
            missed = 0;
            basketX = 170;
            gameActive = true;

            scoreDisplay.textContent = score;
            missedDisplay.textContent = missed;
            basket.style.left = basketX + 'px';
            gameOverScreen.style.display = 'none';

            clearInterval(spawnInterval);
            spawnInterval = setInterval(spawnStar, 1000);

            cancelAnimationFrame(gameLoopId);
            gameLoopId = requestAnimationFrame(update);
        }

        function endGame() {
            gameActive = false;
            clearInterval(spawnInterval);
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
        }

        // Auto start on load
        startGame();
    </script>
</body>
</html>
